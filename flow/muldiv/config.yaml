# M1: muldiv standalone hardening.
# Unlike the ALU, this DUT is sequential and has a real clock - no harness needed.
DESIGN_NAME: muldiv

VERILOG_FILES:
  - dir::../../rtl/pkg/rv32_pkg.sv
  - dir::../../rtl/core/mul_unit.sv
  - dir::../../rtl/core/div_unit.sv
  - dir::../../rtl/core/muldiv.sv

USE_SLANG: true

# Authored constraints - replaces OpenROAD's generic fallback SDC.
PNR_SDC_FILE: dir::../constraints/block.sdc
SIGNOFF_SDC_FILE: dir::../constraints/block.sdc

CLOCK_PORT: clk
CLOCK_PERIOD: 20

FP_CORE_UTIL: 40
PL_TARGET_DENSITY_PCT: 50

pdk::sky130A:
  MAX_FANOUT_CONSTRAINT: 6
