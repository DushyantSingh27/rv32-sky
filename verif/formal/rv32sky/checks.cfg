# riscv-formal check configuration for RV32-SKY. M3.6.
#
# Every option name, section name and column position in this file was read out
# of checks/genchecks.py and `help read_slang`, not recalled.
# PROJECT_INSTRUCTIONS 2.1: tool flags and config keys are T5 by default, and
# failure mode #3 has four instances.

[options]
# genchecks.py:132 parses this against
#   ^rv(\d+)([ie])([a-v]*)(_?[SZX]\w+)?$
# and then opens insns/isa_<isa>.txt. IF THAT FILE IS ABSENT genchecks prints
# "skipping instruction checks" TO STDERR AND CONTINUES (genchecks.py:554),
# still reporting "Generated N checks". So the check COUNT must be read, not the
# exit code: 45 = 37 instruction + 8 consistency; 8 alone would mean the isa
# file was not found.
#
# rv32i is not a Stage 1 compromise, it is correct permanently. There is no
# isa_rv32i_zicsr.txt on disk - the only _Z variants are bit-manipulation - and
# csrw checks are generated from the [csrs] section rather than from the isa
# file (genchecks.py:557).
#
# NOT modelled by any of the 37: fence, fence.i, ecall, ebreak, wfi, mret.
# Those remain covered only by tb_decoder.cpp's hand-written vectors and by
# ACT4's trap tests. Third instance of the same pattern - a tool verifies what
# its models or programs happen to cover. docs/results/0025.
isa rv32i

# bmc, not prove. Bounded model checking to depth 10 first; unbounded induction
# is a different proposition and a later one.
mode bmc
solver boolector

[depth]
# THIS SECTION IS THE ENABLE LIST, not tuning. genchecks.py:368 and :627 both
# `if depth_cfg is None: return` - a check with no entry here is never
# generated at all.
#
# COLUMN SEMANTICS, read from the check_cons call sites at genchecks.py:812-834:
#   one number    depth                 insn, ill, fault, csrw, csr_ill
#   two numbers   start, depth          reg, pc_fwd, pc_bwd, causal, cover, hang
#   three numbers start, trig, depth    unique, liveness
# Instruction checks assert len(depth_cfg) == 1 (genchecks.py:369), so a second
# number there is a hard error rather than a silently ignored one.
#
# Depth 10 throughout, matching nerv. This pipeline is 5 stages with a
# registered redirect, so a taken branch has three instructions in flight:
# 10 cycles covers a redirect and its recovery with margin.
insn            10
reg        5    10
pc_fwd     5    10
pc_bwd     5    10
unique     1  5 10
causal     5    10
liveness   1  5 10
ill             10
cover      1    10

# Stage 2, deliberately absent: csrw, csr_ill, csrc_*. Adding them needs a
# [csrs] section and the rvfi_csr_* ports the core does not yet have.
# Also absent: bus_* (needs nbus and the RVFI_BUS_OUTPUTS plumbing) and
# fault (needs RISCV_FORMAL_MEM_FAULT, which this core has no concept of).

[defines]
# YOSYS: rvfi_macros.vh:3-13 makes `rvformal_rand_reg expand to `rand reg` ONLY
# under `ifdef YOSYS. Without it the free inputs become plain `wire`, nothing
# drives them, and every check passes vacuously. Yosys predefines this itself,
# but nerv sets it explicitly and so do we - a vacuous pass is the worst
# possible failure mode, because it is indistinguishable from success.
`define YOSYS

# RISCV_FORMAL_ALIGNED_MEM is REQUIRED, not optional. Read from
# insns/insn_lh.v: the `else` branch has spec_trap = !misa_ok with no alignment
# term, so a misaligned lh would be required to COMPLETE. This core traps with
# cause 4. Only the ALIGNED_MEM branch models a core that traps on
# misalignment, and it is also the branch whose spec_mem_addr is word-aligned
# and whose spec_mem_rmask is positioned relative to it - which is what
# rvfi_mem_addr in rv32_core.sv was corrected to match.
`define RISCV_FORMAL_ALIGNED_MEM

# RISCV_FORMAL itself is defined by genchecks.py:449 for the CHECK sources.
# It does NOT reach the RTL, which slang reads separately - see -D below.
#
# SYNTHESIS is NOT defined here. It would be harmless but misleading: the RTL
# never passes through this frontend, and slang defines SYNTHESIS implicitly
# (`help read_slang`: --no-synthesis-define turns that off).

[verilog-files]
# WRAPPER ONLY. The RTL is NOT read here.
#
# genchecks.py:408 emits `read -sv <check>.sv <these files>` - plain Yosys.
# MEASURED 2026-09-27: that frontend fails on rtl/pkg/rv32_pkg.sv:178,
# "syntax error, unexpected TOK_CONSTVAL", at
#     MEM_B:   return 1'b0;
# a `return` used directly as a case-item statement inside a function. Wrapping
# it in begin/end would clear that line and the parser would then reach the
# packed ctrl_t struct immediately below. Chasing a frontend we already decided
# against (ADR-0001) by editing RTL that lockstep, ACT4 and 41 mutations were
# run against is the wrong trade: the formally-verified core would stop being
# textually the synthesised core.
#
# wrapper.sv stays here because it is plain Verilog and MUST share plain
# Yosys's macro scope with the generated <check>.sv, which is what defines
# `RVFI_OUTPUTS and `RVFI_CONN32. It instantiates rv32_core before that module
# exists in the design, which Yosys resolves at prep time.
@basedir@/cores/@core@/wrapper.sv

[script-sources]
# Emitted after the `read -sv` line and before `prep` (genchecks.py:413).
#
# slang is the project's Yosys frontend per ADR-0001, so the core proved here
# is read by the same frontend that synthesises it.
#
# -D RISCV_FORMAL is REQUIRED and is not inherited from [defines] above: that
# block lands in defines.sv, which only the check sources include. Omit it and
# the rvfi_* ports simply do not exist, surfacing as an unhelpful port error on
# `RVFI_CONN32 rather than as a missing define.
#
# SYNTHESIS is implicit in slang, which strips the `ifndef SYNTHESIS trace
# ports and csr.sv's immediate assertion for free.
#
# --top rv32_core: without it slang picks tops automatically and tcm.sv, which
# nothing in this hierarchy instantiates, would become a second one.
#
# THIS LIST MUST MATCH rtl/files.f and nothing currently enforces that. It is
# the duplicated-source-list problem this project has hit four times. -F looked
# like the fix - it reads a file list with paths relative to the file itself -
# but files.f holds repo-root-relative paths while living in rtl/, so every
# entry would resolve one directory too deep. A guard comparing the two lists
# is a follow-up, not done.
#
# ONE LINE, deliberately. A Yosys script file takes one command per line and
# whether its parser honours a trailing backslash is not something to recall -
# a continuation that is not honoured would pass "\" to slang as a filename.
# Unreadable beats uncertain here; the list order is the same as rtl/files.f.
plugin -i slang
read_slang --std 1800-2017 -D RISCV_FORMAL --top rv32_core @basedir@/cores/@core@/rtl/pkg/rv32_pkg.sv @basedir@/cores/@core@/rtl/core/alu.sv @basedir@/cores/@core@/rtl/core/regfile.sv @basedir@/cores/@core@/rtl/core/decoder.sv @basedir@/cores/@core@/rtl/core/imm_gen.sv @basedir@/cores/@core@/rtl/core/if_stage.sv @basedir@/cores/@core@/rtl/core/lsu.sv @basedir@/cores/@core@/rtl/core/hazard_unit.sv @basedir@/cores/@core@/rtl/core/csr.sv @basedir@/cores/@core@/rtl/mem/tcm.sv @basedir@/cores/@core@/rtl/core/rv32_core.sv

[cover]
# Reachability, not correctness. A cover that cannot be hit means the solver
# cannot drive the core into that state at all - which would invalidate every
# other check silently, since an unreachable state satisfies any assertion.
#
# Two retirements: the minimum evidence that the pipeline advances.
always @* if (!reset) cover (channel[0].cnt_insns == 2);
# A trapping retirement: evidence the solver can reach the trap path, which
# causes 0/2/4/6 in rvfi_trap depend on.
always @* if (!reset) cover (rvfi_valid && rvfi_trap);
