# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: unconfigured
name: rv32sky
description: RV32-SKY - RV32I five-stage in-order core. No CSRs, no traps, no M, no C.

# I only. Zifencei is declared because rtl/core/decoder.sv accepts
# OP_MISCMEM funct3 001 (fence.i) as a legal no-op, which is architecturally
# correct for a single-hart, in-order core with no I-cache and no store
# buffer. This matches verif/sail/rv32sky.json, which keeps Zifencei enabled
# for the same reason.
#
# NOT declared, and why:
#   Zicsr - rtl/core/csr.sv exists and is verified standalone (UVM env 4) but
#           is NOT in rtl/files.f and NOT instantiated in rv32_core.sv.
#           decoder.sv flags OP_SYSTEM as illegal.
#   Sm    - no M-mode CSRs, no mtvec, no trap entry. Trap detection is M4.
#   M, C  - muldiv verified standalone but not instantiated; C not implemented.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: Zifencei, version: "= 2.0" }

params:
  MXLEN: 32

# All Sm-scoped parameters removed 2026-08-21. UDB rejected MXLEN,
# PHYS_ADDR_WIDTH, M_MODE_ENDIANNESS and MISALIGNED_LDST with
# "Parameter is not defined by this config ... Failing condition: Sm>=0 false".
# They belong to Sm, which this core does not implement.
